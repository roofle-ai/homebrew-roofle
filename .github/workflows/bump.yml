name: Bump cask

on:
  schedule:
    - cron: "17 6 * * *"   # daily; a new roofle release lands in the tap within a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cask to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/roofle-ai/roofle/releases/latest --jq .tag_name | sed 's/^v//')
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/roofle.rb)
          [ "$latest" != "$current" ] || { echo "up to date ($current)"; exit 0; }
          curl -fsSL -o roofle.dmg \
            "https://github.com/roofle-ai/roofle/releases/download/v${latest}/Roofle_${latest}_aarch64.dmg"
          sha=$(sha256sum roofle.dmg | cut -d' ' -f1)
          sed -i -e "s/^  version \".*\"/  version \"${latest}\"/" \
                 -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/roofle.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump to ${latest}"
          git push
